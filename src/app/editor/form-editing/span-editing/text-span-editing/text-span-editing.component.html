<p class="spaced-between-container">
  <span>
    <span>
      Font size
    </span>
    <br>
    <select #font_size_selection (change)="onFontSizeChange(font_size_selection.value)"
            matTooltip="This is the font size of the text. Choose one among the available options."
            [matTooltipShowDelay]="SHOW_DELAY"
            [matTooltipPosition]="POSITION">
      <option *ngFor="let font_size of FONT_SIZE_OPTIONS"
              [value]="font_size"
              [selected]="font_size === text_span.font_size? 'selected': ''">
        {{font_size}}
      </option>
    </select>
  </span>

  <span>
    <span>
      Font weight
    </span>
    <br>
    <select #font_weight_selection (change)="onFontWeightChange(font_weight_selection.value)"
            matTooltip="This is the font weight of the text. Choose one among the available options."
            [matTooltipShowDelay]="SHOW_DELAY"
            [matTooltipPosition]="POSITION">
      <option *ngFor="let font_weight of FONT_WEIGHT_OPTIONS"
              [value]="font_weight"
              [selected]="font_weight === text_span.font_weight? 'selected': ''">
        {{font_weight}}
      </option>
    </select>
  </span>

  <textarea [(ngModel)]="text_span.text"
            rows="3"
            cols="30"
            autocomplete="off"
            placeholder="Write here any text you want to make visible at the top of the form."
            class="description-input">
  </textarea>
</p>
